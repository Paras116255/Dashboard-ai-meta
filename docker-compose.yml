services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://adpilot:adpilot_secret@postgres:5432/adpilot_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=adpilot_super_secret_jwt_key_32_bytes_long_min!
      - ENCRYPTION_KEY=adpilot_meta_token_encryption_key_32bytes
      - USE_MOCK_META_API=true
      - AI_PROVIDER=mock
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    environment:
      - DATABASE_URL=postgresql://adpilot:adpilot_secret@postgres:5432/adpilot_db?schema=public
      - REDIS_URL=redis://redis:6379
      - USE_MOCK_META_API=true
      - AI_PROVIDER=mock
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: adpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: adpilot
      POSTGRES_PASSWORD: adpilot_secret
      POSTGRES_DB: adpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adpilot_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
